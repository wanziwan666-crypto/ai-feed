name: Fetch RSS Feed

on:
  schedule:
    # 每 6 小时抓取一次（UTC 时间 0,6,12,18 点）
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # 手动触发

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - run: node scripts/prepare-feed.js

      - name: Commit feed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          git diff --staged --quiet || git commit -m "auto: update feed $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
